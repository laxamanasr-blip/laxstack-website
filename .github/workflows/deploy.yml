name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticate to the Free AWS Account via GitHub OIDC
      - name: Configure AWS Credentials (Free Account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::784038766514:role/Github-website-Deploy
          aws-region: ap-southeast-2

      # Sync website to S3
      - name: Deploy Website to S3
        run: |
          aws s3 sync . s3://laxstack.com \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore"

      # Assume the CloudFront role in the Paid AWS Account
      - name: Configure AWS Credentials (Paid Account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::461837196158:role/Cloudfront-Invalidation
          aws-region: us-east-1
          role-chaining: true
          role-skip-session-tagging: true

      # Invalidate the CloudFront cache
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1NDU11OOWXLM8 \
            --paths "/*"