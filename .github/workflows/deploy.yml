name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticate to Free AWS Account
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::784038766514:role/Github-website-Deploy
          aws-region: ap-southeast-2

      # Upload website to S3
      - name: Deploy Website to S3
        run: |
          aws s3 sync . s3://laxstack.com \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore"

      # Switch to Paid AWS Account
      - name: Assume CloudFront Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::461837196158:role/Cloudfront-Invalidation
          aws-region: us-east-1
          role-chaining: true

      # Invalidate CloudFront
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1NDU11OOWXLM8 \
            --paths "/*"